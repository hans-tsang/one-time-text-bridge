{% extends "base.html" %}
{% block title %}Live shared note{% endblock %}
{% block content %}
<section class="card">
  <h1>Live shared note</h1>
  <p class="hint" id="live-status" aria-live="polite">Connecting...</p>
  <label for="live-note">Shared text (max {{ max_length }} characters)</label>
  <textarea
    id="live-note"
    class="received-text"
    rows="12"
    maxlength="{{ max_length }}"
    data-websocket-url="{{ url_for('live_note_socket', raw_token=raw_token) }}"
  >{{ text }}</textarea>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='/js/app.js') }}"></script>
{% endblock %}
