<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>{% block title %}One-Time Text Bridge{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">One-Time Text Bridge</a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>No accounts. No tracking. Messages are deleted after they are read or expire.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
