name: Build Windows release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Create Windows deployment package
        shell: pwsh
        run: |
          $packageRoot = "dist/one-time-text-bridge"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item app, requirements.txt, .env.example, web.config, README.md -Destination $packageRoot -Recurse
          Compress-Archive -Path $packageRoot -DestinationPath "dist/one-time-text-bridge-windows.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-time-text-bridge-windows
          path: dist/one-time-text-bridge-windows.zip

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tagName = if ($env:GITHUB_REF -like "refs/tags/*") {
              $env:GITHUB_REF_NAME
          } else {
              "v0.1.0"
          }
          gh release create $tagName dist/one-time-text-bridge-windows.zip --generate-notes --title $tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release upload $tagName dist/one-time-text-bridge-windows.zip --clobber
          }